<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bc-floating-cart 購物袋圖示 — 5 個選項</title>
<!-- 2026-09-21：浮動購物車（同日改版＝只顯示圖示本體、無圓形底／無邊框／無陰影）購物袋圖示挑選預覽頁。
     本頁直接載入正式的 ../css/bc-components.css（相對路徑）→
       按鈕外觀（無底色／無邊框／無陰影、hover 轉品牌金、金色數字 badge）與線上完全一致；
       圖示尺寸為線上各斷點值（桌機 52px／平板 48px／手機 44px），本頁三種都列出方便比較。
     開啟方式：
       Django dev server → http://127.0.0.1:8081/static/preview/bc-floating-cart-icons.html
       或瀏覽器直接開啟本檔（file://，相對路徑同樣可解析）。
     選定後：只改 templates/betweencoffee_delivery/base.html 內
             <span class="icon material-icons">shopping_bag</span> 的圖示名稱（一個字），
             並同步該處註解清單。 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
<link rel="stylesheet" href="../css/bc-components.css">
<style>
  /* 僅預覽頁版面；按鈕本體樣式一律來自 ../css/bc-components.css（不重刻） */
  body { margin: 0; padding: 32px; background: #0e0e0e; color: rgba(255, 255, 255, .9); font-family: 'Noto Sans TC', sans-serif; }
  h1 { font-size: 1.2rem; font-weight: 500; margin: 0 0 8px; }
  .note { font-size: .85rem; font-weight: 300; line-height: 1.8; color: rgba(255, 255, 255, .5); margin: 0 0 26px; max-width: 64em; }
  .note code { color: #fcff4b; font-family: monospace; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 16px; }
  .card { background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .08); border-radius: 12px; padding: 18px 16px 14px; }
  .no { font-size: 1.05rem; font-weight: 700; color: #fcff4b; line-height: 1; }
  .nm { font-size: .85rem; font-weight: 500; margin-top: 3px; }
  .dsc { font-size: .7rem; font-weight: 300; color: rgba(255, 255, 255, .4); margin-top: 2px; }
  .sizes { display: flex; align-items: flex-end; gap: 20px; margin: 16px 0 4px; }
  .size { text-align: center; }
  .size .lbl { display: block; font-size: .62rem; color: rgba(255, 255, 255, .35); font-family: monospace; margin-top: 4px; }
  .code { margin-top: 10px; font-size: .66rem; font-family: monospace; color: rgba(255, 255, 255, .45); }
  /* 預覽用覆寫：取消 fixed 定位（讓 5 個候選並排）；其餘（無底色／無邊框／無陰影、
     hover 轉金、badge、--bc-fc-size 尺寸）全部沿用正式 CSS */
  .card .bc-floating-cart { position: static; top: auto; right: auto; bottom: auto; left: auto; pointer-events: auto; }
</style>
</head>
<body>
<h1>bc-floating-cart 購物袋圖示 — 5 個選項</h1>
<p class="note">
  本頁載入正式 <code>bc-components.css</code>：圖示<b>無圓形底、無邊框、無陰影</b>，hover 轉品牌金 <code>#fcff4b</code>，
  右上角為金色數字 badge — 與線上完全一致。<br>
  每個候選列出三種斷點尺寸（桌機 <code>48px</code>／平板 <code>44px</code>／手機 <code>40px</code>；字形內建留白，實際墨跡約再小 4px；
  手機另有 44px 透明點擊區，只縮字形不縮可點範圍）。<br>
  目前使用：<code>1 shopping_bag</code>。選定後只需改
  <code>templates/betweencoffee_delivery/base.html</code> 內該行的圖示名稱（一個字）。
</p>
<div class="grid" id="grid"></div>
<script>
  var OPTIONS = [
    ['shopping_bag',    '購物袋',            'Material Icons',   '目前使用', 'material-icons'],
    ['local_mall',      '提袋（購物中心袋）', 'Material Icons',   '',        'material-icons'],
    ['shopping_basket', '提籃',              'Material Icons',   '',        'material-icons'],
    ['work',            '公事包',            'Material Icons',   '',        'material-icons'],
    /* 5 號原為 Material Symbols 的 tote，但本專案載入的變體沒有該字形（實測退回文字「TOTE」），
       改為 Material Icons 的 backpack（已實測可正常渲染）。 */
    ['backpack',        '背包',              'Material Icons',   '',        'material-icons']
  ];
  var SIZES = [48, 44, 40];
  var LABELS = { 48: '48px 桌機', 44: '44px 平板', 40: '40px 手機' };
  document.getElementById('grid').innerHTML = OPTIONS.map(function (o, i) {
    var cells = SIZES.map(function (s) {
      return '<div class="size">'
        + '<div class="bc-floating-cart" style="--bc-fc-size:' + s + 'px">'
        +   '<button class="bc-floating-cart-btn" type="button" aria-label="購物車">'
        +     '<span class="icon ' + o[4] + '">' + o[0] + '</span>'
        +     '<span class="bc-floating-cart-badge">3</span>'
        +   '</button>'
        + '</div>'
        + '<span class="lbl">' + LABELS[s] + '</span>'
        + '</div>';
    }).join('');
    return '<div class="card">'
      + '<div class="no">' + (i + 1) + '</div>'
      + '<div class="nm">' + o[1] + (o[3] ? '　<span style="color:#fcff4b;font-size:.7rem">（' + o[3] + '）</span>' : '') + '</div>'
      + '<div class="dsc">' + o[2] + '</div>'
      + '<div class="sizes">' + cells + '</div>'
      + '<div class="code">&lt;span class="icon ' + o[4] + '"&gt;' + o[0] + '&lt;/span&gt;</div>'
      + '</div>';
  }).join('');
</script>
</body>
</html>
