<!-- socialuser/templates/socialuser/reactivate.html -->
{% extends 'layouts/blank.html' %}

{% block title %}重新啟用帳戶 - Between Coffee{% endblock %}

{% block content %}
<section class="ftco-section-blank"></section>

<section class="ftco-subpage-section ftco-section-single-product">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-lg-6 mb-5 ftco-animate">
                <h1 class="mb-4">重新啟用帳戶</h1>

                <div class="">
                    <p>您可以在停用後 30 天內重新啟用您的帳戶。</p>
                    <p>- 請輸入停用時使用的 Email。</p>
                    <p>- 若超過 30 天，將無法重新啟用。</p>
                </div>

                <form method='POST'>
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="email">Email：</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">重新啟用帳戶</button>
                        <a class="btn btn-secondary ml-2" href="{% url 'account_login' %}">返回登入</a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</section>

{% endblock %}
