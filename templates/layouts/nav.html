<!-- nav.html -->
<nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
    <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}">&#65371; Between &#65373; </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <!-- 2026-08-10: 漢堡選單套用 c-attract 動畫（三條線，參考 cheesetart.com） -->
            <div class="bc-attract-menu">
                <div class="c-attract">
                    <div class="bc-attract-menu__body c-attract__layer">
                        <span data-position="top"></span>
                        <span data-position="middle"></span>
                        <span data-position="bottom"></span>
                    </div>
                </div>
            </div>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item d-lg-none">
                    <a class="nav-link" href="#" id="bc-cart-toggle" aria-label="購物車">
                        <span class="icon material-icons">shopping_cart</span>
                        <span class="cart-count cart-amount-label cart-amount-label-pill bc-cart-badge bc-cart-count">{{ cart_count }}</span>
                    </a>
                </li>
            </ul>
        </div>
        {% if request.resolver_match.url_name == 'about' %}
        <!-- 2026-08-26: 橫濱 Timber Wharf 天氣元件（完整複製 yokohama-timberwharf.com .weather -font_en；僅 about 頁右上角顯示）
             2026-08-26 新增時鐘：動畫循環順序 時鐘 → 天氣 icon → 溫度 -->
        <div class="weather -font_en -color_white" data-bc-weather>
            <div class="view">
                <div class="clock"><span class="value">--:--</span></div>
                <div class="icon"></div>
                <span class="temperature">
                    <span class="value">23</span>
                    <span class="unit">°C</span>
                </span>
            </div>
            <span class="date">
                <span class="month"></span>, <span class="day"></span><span class="year"></span>
            </span>
            <span class="border"></span>
        </div>
        <script>
        /* 2026-08-26：立即同步填入時鐘 + 日期，避免載入時不同步（時間先、日期後）。
           在 DOM 解析到此處時同步執行（早於 bc-weather.js 外部腳本）；
           bc-weather.js 的 updateClock/fillDate 仍會持續更新（此為早期快照，兩者一致）。
           日期為瀏覽器本地時間，不依賴天氣 API。 */
        (function () {
            var w = document.querySelector('.weather');
            if (!w) return;
            var d = new Date();
            var pad = function (n) { return ('0' + n).slice(-2); };
            var v = w.querySelector('.clock .value');
            if (v) v.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
            var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            var m = w.querySelector('.month');
            if (m) m.textContent = MONTHS[d.getMonth()];
            var day = w.querySelector('.day');
            if (day) day.textContent = pad(d.getDate());
            var y = w.querySelector('.year');
            if (y) y.textContent = d.getFullYear();
        })();
        </script>
        {% endif %}
    </div>
</nav>
<!-- 2026-08-10: Buy & Order 流動按鈕（c-attract，參考 cheesetart.com）
     移至 <nav> 外、body 直接子層（z-index 修復）：
     #ftco-navbar 為 position:absolute + z-index:3，會建立 stacking context，
     按鈕若在 nav 內 z-index:99999 會被鎖在層級 3，低於 #borders(9999) 而被虛線蓋住。
     移出後與 #borders 同層比較 → 99999 > 9999 → 按鈕在最頂、右側虛線在下。 -->
<div class="bc-attract-nav">
    <div class="bc-attract-buy">
        <div class="c-attract">
            <a href="{% url 'coffee_menu' %}" class="bc-attract-buy__link c-attract__layer">

                <span lang="en">Order</span>
            </a>
        </div>
    </div>
    <!-- 2026-08-18: 個人資料圓形按鈕（複製 bc-attract-buy 外觀，圓形 + 圖標，連結 profile） -->
    <div class="bc-attract-profile">
        <div class="c-attract">
            <a href="{% url 'socialuser:profile' %}" class="bc-attract-profile__link c-attract__layer">
                <span class="icon material-icons c-icon">person</span>
            </a>
        </div>
    </div>
</div>
