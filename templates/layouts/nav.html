<nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
    <div class="container">
        <!-- 2026-10-17（使用者指示）：BETWEEN logo 改為「捲動時固定左上角」＋「自動變色」。
             原本的 <a class="navbar-brand">…</a> 拆成兩個角色（樣式見 bc-components.css
             的「navbar-brand 固定左上角 + 自動變色」區塊）：
               · 這裡保留同 size／同 class 的排版佔位（span，aria-hidden、visibility:hidden）
                 → navbar 右側（weather／選單）的水平排版完全不變；
                   bc-attract-place.js 仍以 `#ftco-navbar .navbar-brand` 的 rect 當對齊基準。
               · 真正的連結移到 </nav> 之後、body 直接子層（.bc-navbar-brand-fixed）。
             為何要移出 nav：mix-blend-mode 只會與「同一個 stacking context 的 backdrop」
             混合；#ftco-navbar 為 position:absolute + z-index（bc-components.css 設 100）
             會建立 stacking context，logo 留在 nav 內就永遠吃不到頁面內容的顏色
             → 遇到白色／淺色區塊會直接消失。 -->
        <span class="navbar-brand bc-navbar-brand-spacer" aria-hidden="true">&#65371; Between &#65373;</span>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <!-- 2026-08-10: 漢堡選單套用 c-attract 動畫（三條線，參考 cheesetart.com） -->
            <div class="bc-attract-menu">
                <div class="c-attract">
                    <div class="bc-attract-menu__body c-attract__layer">
                        <span data-position="top"></span>
                        <span data-position="middle"></span>
                        <span data-position="bottom"></span>
                    </div>
                </div>
            </div>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item d-lg-none">
                    <a class="nav-link" href="#" id="bc-cart-toggle" aria-label="購物車">
                        <!-- 2026-10-19（首頁效能 P0）：Material Icons → icomoon（首頁不再載入 Material 字型） -->
                        <span class="icon icon-shopping-cart" aria-hidden="true"></span>
                        <span class="cart-count cart-amount-label cart-amount-label-pill bc-cart-badge bc-cart-count">{{ cart_count }}</span>
                    </a>
                </li>
            </ul>
        </div>
        <!-- 2026-08-26: 橫濱 Timber Wharf 天氣元件（完整複製 yokohama-timberwharf.com .weather -font_en；右上角顯示）
             2026-08-26 新增時鐘：動畫循環順序 時鐘 → 天氣 icon → 溫度
             2026-08-27 應用於全域（nav.html 無條件顯示，全站右上角）
             2026-09-21（使用者指示）：**改為全站隱藏、只有 about 頁顯示** →
               加 .weather--visible（bc-weather.css 預設 visibility: hidden——保留 navbar 排版空間、
               不造成 navbar 位移；bc-weather.js 亦僅在 about 頁載入，見 base.html）
             2026-10-17（使用者指示）：「移除時鐘，只保留天氣與溫度」→ 刪掉 .clock 節點，
               循環改為 icon ⇄ 溫度（本頁 inline script 的 ORDER 亦同步） -->
        <div class="weather -font_en -color_white{% if request.resolver_match.url_name == 'about' %} weather--visible{% endif %}" data-bc-weather>
            <div class="view">
                <div class="icon"></div>
                <span class="temperature">
                    <span class="value"></span>
                    <span class="unit">°C</span>
                </span>
            </div>
            <span class="date">
                <span class="month"></span>, <span class="day"></span><span class="year"></span>
                <!-- 2026-08-27：weekday 徽章（yokohama-timberwharf event/1125 .weekday；香港真實星期） -->
                <span class="weekday">--</span>
            </span>
            <span class="border"></span>
        </div>
        <script>
        /* 2026-08-26：立即同步填入日期，避免載入時不同步。
           2026-08-27：加 weekday（香港真實星期）。
           2026-08-28：依 sessionStorage 恢復動畫狀態與溫度——在首 paint 前執行
           （weather 元素後、body 尾 bc-weather.js 之前），避免轉跳後先顯示別的天氣狀態
           再切換的閃現抖動；weather 全程可見（無 opacity 隱藏）。
           2026-10-17（使用者指示：移除時鐘）：不再填 .clock、ORDER 改為 icon ⇄ 溫度；
           sessionStorage 的 bcWeatherIndex 仍沿用（舊值 2 超出範圍 → 回落 0）。 */
        (function () {
            var w = document.querySelector('.weather');
            if (!w) return;
            var d = new Date();
            var pad = function (n) { return ('0' + n).slice(-2); };
            var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            var m = w.querySelector('.month');
            if (m) m.textContent = MONTHS[d.getMonth()];
            var day = w.querySelector('.day');
            if (day) day.textContent = pad(d.getDate());
            var y = w.querySelector('.year');
            if (y) y.textContent = d.getFullYear();
            var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            var wd = w.querySelector('.weekday');
            if (wd) wd.textContent = WEEKDAYS[d.getDay()];

            /* 2026-08-28：恢復上次動畫狀態（sessionStorage bcWeatherIndex）。
               直接設 transform，首 paint 即顯示上次狀態（無第一態閃現）。
               2026-10-17：狀態由 3 態改為 2 態（icon / temperature），位移量沿用 80px
               （navbar 那顆的 --wc-scale 未設＝1；hero 那顆由 bc-weather.js 另行定位）。 */
            var ORDER = ['icon', 'temperature'];
            var idx = parseInt(sessionStorage.getItem('bcWeatherIndex') || '-1', 10);
            if (!(idx >= 0 && idx < ORDER.length)) idx = 0;
            ORDER.forEach(function (n, i) {
                var el = w.querySelector('.' + n);
                if (el) el.style.transform = 'translateX(' + (i === idx ? 0 : 80) + 'px)';
            });
            /* 2026-08-28：溫度值（sessionStorage 快取），首 paint 即正確溫度 */
            try {
                var data = JSON.parse(sessionStorage.getItem('bcWeatherData') || 'null');
                var tv = w.querySelector('.temperature .value');
                if (data && data.main && tv) tv.textContent = Math.round(data.main.temp);
            } catch (e) {}
        })();
        </script>
    </div>
</nav>
